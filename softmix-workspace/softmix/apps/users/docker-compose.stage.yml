version: '3.9'
services:
  softmix.mongodb:
    image: mongo:7
    restart: always
    container_name: softmix.mongodb
    env_file:
      - ../../environments/.users.env
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - softmix.volume:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017 --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  softmix.users:
    image: ghcr.io/artidy/softmix.users:latest
    restart: always
    container_name: softmix.users.service
    depends_on:
      - softmix.mongodb
    ports:
      - "3333:3333"
    env_file:
      - ../../environments/.users.env

volumes:
  softmix.volume: {}
