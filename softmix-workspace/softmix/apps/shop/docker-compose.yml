version: "3.9"
services:
  softmix-shop.postgres:
    image: postgres:16-alpine
    restart: always
    container_name: softmix-shop.postgres
    env_file:
      - ../../environments/.shop.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -W ${POSTGRES_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./db:/var/lib/postgresql/data

  softmix-shop.pgadmin:
    container_name: softmix-shop.pgadmin
    restart: always
    image: dpage/pgadmin4:7.8
    env_file:
      - ../../environments/.shop.env
    volumes:
      - ./db:/var/lib/pgadmin
    ports:
      - "8083:80"
    depends_on:
      - softmix-shop.postgres
