version: "3.9"
services:
  devandy-portal.postgres.portal:
    image: postgres:16-alpine
    restart: always
    container_name: devandy-portal.postgres.portal
    env_file:
      - .portal.env
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -W ${POSTGRES_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - devandy-portal.volume:/data/db-postgres
    networks:
      - devandy-portal.network

  devandy-portal.service.portal:
    image: ghcr.io/artidy/devandy-portal.service.portal:latest
    restart: always
    depends_on:
      - devandy-portal.postgres.portal
    container_name: devandy-portal.service.portal
    ports:
      - "127.0.0.1:4444:4444"
    env_file:
      - .portal.env
    networks:
      - devandy-portal.network

networks:
  devandy-portal.network:
    name: devandy-portal.network
    driver: bridge

volumes:
  devandy-portal.volume:
    name: devandy-portal.volume
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/postgres
      o: bind
