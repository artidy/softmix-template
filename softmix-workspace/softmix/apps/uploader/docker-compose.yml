version: "3.9"
services:
  softmix-uploader.service:
    image: ghcr.io/artidy/softmix-uploader.service:latest
    restart: always
    container_name: softmix-uploader.service
    volumes:
      - softmix.volume:/src/assets
    ports:
      - "127.0.0.1:7777:7777"
    env_file:
      - ../../environments/.uploader.env

volumes:
  softmix.volume: {}
