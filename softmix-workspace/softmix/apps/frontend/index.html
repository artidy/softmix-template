<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soft Mix</title>
    <meta
      name="description"
      content="Компьютеры, серверное и сетевое оборудование, системы электропитания и программное обеспечение для бизнеса."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      // Тема до первой отрисовки, чтобы не мигал светлый фон: сохранённая или системная.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
