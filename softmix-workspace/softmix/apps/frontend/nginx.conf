server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    client_max_body_size 50m;

    # Сжатие в самом контейнере, чтобы не зависеть от внешнего прокси.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://softmix.bff:5555/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    # Фото товаров и логотип, загруженные в панели управления, хранит и раздаёт сервис uploader.
    # Сначала смотрим статику из сборки (там лежат фото, добавленные раньше вручную).
    # ^~ — чтобы правило для статики ниже не перехватывало эти .jpg/.png.
    location ^~ /assets/img/products/ {
        try_files $uri @uploader;
    }

    location @uploader {
        # Адрес через переменную: nginx запустится, даже если uploader ещё не поднялся.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $uploader http://softmix.uploader:7777;
        proxy_pass $uploader;
        proxy_set_header Host $host;
    }

    # index.html всегда сверяется с сервером: после деплоя браузер сразу берёт новую версию.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Файлы с хешем в имени не меняются — их можно кэшировать на год.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /index.html;
}
